<header class="titlebar" id="titlebar">
  <div class="tb-drag pywebview-drag-region"><span class="tb-title">CharForge</span><span class="muted" id="save-state"></span></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="ru">RU</button>
  </div>
  <div class="win-controls">
    <button class="win-btn" id="btn-minimize" title="Minimize"><svg viewBox="0 0 12 12" width="10" height="10"><rect x="1" y="5.5" width="10" height="1.2" rx="0.6" fill="currentColor"/></svg></button>
    <button class="win-btn" id="btn-maximize" title="Maximize"><svg viewBox="0 0 12 12" width="10" height="10"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
    <button class="win-btn close" id="btn-close" title="Close"><svg viewBox="0 0 12 12" width="10" height="10"><path d="M2.2 2.2l7.6 7.6M9.8 2.2L2.2 9.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>
</header>

<main id="main"><div class="empty">…</div></main>

<div id="toast" role="status"></div>
<input type="file" id="file-import" accept=".json,application/json" hidden />

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" role="dialog">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel" data-i18n="cancel">Cancel</button>
      <button class="btn danger" id="modal-confirm"></button>
    </div>
  </div>
</div>
